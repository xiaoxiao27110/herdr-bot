[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hq-pilot"
version = "0.1.0"
description = "General-purpose 24/7 multi-repo R&D orchestrator engine for native coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
hq = "hq_pilot.cli:main"
hq-notify = "hq_pilot.notify_cli:main"
hq-agent-hook = "hq_pilot.hook_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hq_pilot*"]
