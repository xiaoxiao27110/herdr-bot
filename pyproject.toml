[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-bot"
version = "0.2.0"
description = "24/7 multi-repo R&D orchestrator for native coding agents on Herdr interactive terminals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
feishu = [
    "lark-oapi>=1.4",
]

[project.scripts]
herdr-bot = "hq_pilot.cli:main"
hq = "hq_pilot.cli:main"
hq-notify = "hq_pilot.notify_cli:main"
hq-agent-hook = "hq_pilot.hook_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hq_pilot*"]
