version: 1
project_name: acme-cloud

agent:
  # Supported built-in backends: agy | codex
  # Custom adapters can also be loaded dynamically via "some.module:ClassName"
  backend: agy
  index_file: AGENTS.md
  default_effort: high
  light_effort: low
  # Permission mode: default | turbo (always-proceed) | accept-edits | skip-all
  permission_mode: "default"
  # Auto-trust managed HQ / repo / worktree dirs in $CODEX_HOME/config.toml (codex backend)
  # Set to false to skip writing config.toml and print the TOML snippet for manual setup instead.
  auto_trust_project: true

terminal:
  backend: auto

channel:
  backend: telegram
  allowed_chat_id: ""

repos:
  gateway-svc:
    git_url: https://git.example.com/acme/gateway-svc.git
    default_branch: main
  worker-svc:
    git_url: https://git.example.com/acme/worker-svc.git
    default_branch: main

tuning:
  index_max_lines: 200
  index_max_bytes: 25600
  today_wal_max_lines: 60
  dream_cron: "23:30"
  dream_min_interval_hours: 24
  dream_min_sessions: 5
  dream_force_nightly: true
  digest_cron: "09:30"
  inbox_lease_ttl_sec: 900
  inbox_max_attempts: 3
  commit_debounce_sec: 900
  active_repo_quiet_minutes: 15
  pane_blocked_notify_sec: 0
  deferred_approval_ttl_hours: 24
  general_idle_seal_minutes: 1440
  general_max_turns: 60
  general_rotate_transcript_mb: 8
  general_rotate_quiet_minutes: 30
  general_nightly_reset: true
  general_rotation_quiet_minutes: 60
  transcript_busy_window_sec: 120
  distill_idle_minutes: 60
  distill_min_new_turns: 8
  dirty_worktree_warn_hours: 48
  git_sync_debounce_minutes: 120
  past_messages_limit: 5
  quiet_hours: ""
  outbox_max_retries: 5
  outbox_max_per_minute: 12
